<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Λάβετε Προσφορά | Pest-Free</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 768px)">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons.png">
</head>

<body>
  <section class="offer-screen">

    <!-- Language Switch -->
    <div class="lang-switch">
        <button id="lang-gr" onclick="setLanguage('gr')">GR</button>
        <button id="lang-en" onclick="setLanguage('en')">EN</button>
    </div>

    <h1 data-i18n="offer_page_title">Λάβετε Προσφορά</h1>

    <form class="offer-form" action="https://formspree.io/f/mqezgkze" method="POST">
      <input type="hidden" name="_charset_" value="UTF-8">
      <input type="hidden" name="_subject" value="Νέα Προσφορά από το pest-free.gr">
      <input type="hidden" name="_next" value="https://pest-free.gr/thank-you.html">

      <!-- NAME -->
      <label for="name" data-i18n="offer_form_name">Ονοματεπώνυμο</label>
      <input id="name" type="text" name="full_name" required>

      <!-- PHONE -->
      <label for="phone" data-i18n="offer_form_phone">Τηλέφωνο</label>
      <input id="phone" type="tel" name="phone" required>

      <!-- EMAIL -->
      <label for="email" data-i18n="offer_form_email">Email</label>
      <input id="email" type="email" name="email" required>

      <!-- CATEGORY -->
      <label for="category" data-i18n="offer_form_category">Κατηγορία Υπηρεσίας</label>
      <select id="category" name="category" required>
        <option value="" disabled selected data-i18n="offer_form_category_placeholder">-- Επιλέξτε Κατηγορία --</option>
        <option value="insect" data-i18n="offer_form_category_insect">Έντομο</option>
        <option value="rodent" data-i18n="offer_form_category_rodent">Τρωκτικό</option>
        <option value="cert" data-i18n="offer_form_category_cert">Πιστοποίηση Καταλύματος</option>
        <option value="disinfection" data-i18n="offer_form_category_disinfection">Απολύμανση</option>
        <option value="special" data-i18n="offer_form_category_special">Ειδική Επέμβαση</option>
        <option value="plant" data-i18n="offer_form_category_plant">Φυτοπροστασία</option>
        <option value="other" data-i18n="offer_form_category_other">Άλλο</option>
      </select>

      <!-- COMMENTS -->
      <label for="comments" data-i18n="offer_form_comments">Σχόλια</label>
      <textarea id="comments" name="description" rows="5" required></textarea>

      <!-- CONSENT -->
      <div class="consent-box">
        <label>
          <input type="checkbox" name="consent" required>
          <span data-i18n="offer_form_consent">
            Δηλώνω ότι έλαβα γνώση και αποδέχομαι την 
            <a href="privacy.html" target="_blank">Πολιτική Απορρήτου</a>
            και συναινώ στην επεξεργασία των προσωπικών μου δεδομένων 
            για σκοπούς επικοινωνίας.
          </span>
        </label>
      </div>

      <button type="submit" data-i18n="offer_form_submit">Αποστολή</button>
    </form>
  </section>

  <script src="js/i18n.js"></script>
</body>
</html>
